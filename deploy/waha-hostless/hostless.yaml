# WAHA GOWS bounded resource recovery candidate. Do not deploy until the
# Hostless account confirms this resource allocation remains entirely free.
# Preserves the existing PostgreSQL session and one-replica topology.
# One replica is essential: never start parallel WAHA workers for one session.
build:
  system: docker
dockerfile_path: ./Dockerfile
scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
# Allow more headroom for WAHA GOWS restarts; pair with the existing 256 MB
  # PostgreSQL allocation only if combined free usage is confirmed <= 1 GiB.
  max_memory: 512
health_check:
  type: tcp
  interval_in_seconds: 30
