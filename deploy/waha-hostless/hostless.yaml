# Free-budget experiment; not an authorized production deployment.
# One replica is essential: never start parallel WAHA workers for one session.
build:
  system: docker
dockerfile_path: ./Dockerfile
scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 384
health_check:
  type: tcp
  interval_in_seconds: 30
