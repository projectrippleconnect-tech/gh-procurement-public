# Legacy Hostless File Path alternative: use when the app explicitly selects
# deploy/waha-hostless/hostless.yaml instead of the root hostless.yaml.
# The same no-charge limits and Dockerfile apply to both paths.
working_directory: "/"
build_context_directory: "/"
dockerfile_path: "deploy/waha-hostless/Dockerfile"
build:
  system: docker
scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 384
health_check:
  type: tcp
  interval_in_seconds: 30
