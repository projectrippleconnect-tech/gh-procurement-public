name: GH Procurement - One-time free preview retry (sends OFF)
on:
  push:
    branches:
      - ops/stage5-safe-preview-retry-20261102
    paths:
      - .github/workflows/gh-stage5-preview-retry.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: gh-procurement-safe-preview-20261102
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_SITE_ID: b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
      RELEASE_SHA: 435ce4004489916821ab5c4d781784e6035deb0b
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      NEXT_TELEMETRY_DISABLED: '1'
      WAHA_SENDING_ENABLED: 'false'
      GH_AUTO_DISPATCH_ENABLED: 'false'
      GH_AUTO_DELIVERY_TEST_VERIFIED: 'false'
      GH_WA_AUDIT_ENABLED: 'false'
      GH_PORTAL_PROCESSING_ENABLED: 'false'
      GH_PORTAL_DISPATCH_ENABLED: 'false'
      GH_PORTAL_DELIVERY_VERIFIED: 'false'
    steps:
      - name: Verify target credential and source revision
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          test "$RELEASE_SHA" = 435ce4004489916821ab5c4d781784e6035deb0b
      - uses: actions/checkout@v4
        with:
          ref: 435ce4004489916821ab5c4d781784e6035deb0b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build the already-reviewed code
        run: |
          npm ci
          npm run build
      - name: Install Netlify CLI and verify target site (no new site)
        run: |
          npm install --global netlify-cli@27.13.0
          netlify sites:list --json > "$RUNNER_TEMP/gh-sites.json"
          node - <<'NODE'
          const fs=require('fs')
          const o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gh-sites.json','utf8'))
          const sites=Array.isArray(o)?o:(o.sites||[])
          const site=sites.find(x=>x.id===process.env.NETLIFY_SITE_ID)
          if(!site||site.name!=='gh-procurement')throw Error('Wrong target; refusing deployment')
          console.log('Verified existing free GH Procurement project')
          NODE
      - name: Publish DRAFT preview only; never --prod; all supplier flags OFF
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          netlify deploy --build --context production --site "$NETLIFY_SITE_ID" \
            --message "GH Procurement Stage 5 diagnostic preview only $RELEASE_SHA; NO supplier sends" \
            --secret-env "GH_MANUAL_RELEASE_REV=$RELEASE_SHA" \
            --secret-env 'WAHA_SENDING_ENABLED=false' \
            --secret-env 'GH_AUTO_DISPATCH_ENABLED=false' \
            --secret-env 'GH_AUTO_DELIVERY_TEST_VERIFIED=false' \
            --secret-env 'GH_WA_AUDIT_ENABLED=false' \
            --secret-env 'GH_PORTAL_PROCESSING_ENABLED=false' \
            --secret-env 'GH_PORTAL_DISPATCH_ENABLED=false' \
            --secret-env 'GH_PORTAL_DELIVERY_VERIFIED=false' \
            --json > "$RUNNER_TEMP/preview-output.json"
          node - <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/preview-output.json','utf8'));
          const url=o.deploy_url||o.deployUrl||o.url||'';
          if(!/^https:\/\/[a-zA-Z0-9.-]+\.netlify\.app$/.test(url))throw Error('Preview URL unavailable');
          if(url==='https://gh-procurement.netlify.app')throw Error('Refusing production URL')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'preview_url='+url+'\n');
          console.log('PREVIEW_URL='+url);
          NODE
      - name: Read-only verification on draft, no WhatsApp messages
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const base=process.env.PREVIEW_URL
          async function request(path){
            const r=await fetch(base+path,{signal:AbortSignal.timeout(15000),cache:'no-store'})
            console.log(path+' HTTP '+r.status)
            return r
          }
          const health=await request('/api/health')
          assert.equal(health.status,200)
          const h=await health.json()
          assert.equal(h.version,process.env.RELEASE_SHA)
          assert.equal(h.database,'connected')
          assert.equal(h.schema_ready,true)
          const page=await request('/whatsapp-connection-check')
          assert.equal(page.status,200)
          const admin=await request('/api/integrations/whatsapp/pair')
          assert.equal(admin.status,401)
          console.log('PASS: diagnostic page deployed on draft only; health and admin gate verified')
          NODE
      - name: Record outcome to Stage 5 issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pass='${{ steps.publish.outcome }}'==='success'
            const url='${{ steps.publish.outputs.preview_url }}'
            const body=(pass?'Draft Netlify preview published: '+url:'Draft deploy attempt failed; no production change.')+' Stage 5 exact source commit '+process.env.RELEASE_SHA+'. Sending switches OFF; this workflow never publishes production. Run: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:158,body})
