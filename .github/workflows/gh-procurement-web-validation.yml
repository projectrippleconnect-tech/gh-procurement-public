name: GH Procurement Web Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gh-procurement-web-validation.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run procurement contract tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Compile production application
        run: npm run build
