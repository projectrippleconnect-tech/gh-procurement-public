name: GH Procurement Web Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gh-procurement-web-validation.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run procurement contract tests
        run: npm test
      - name: Compile production application
        run: npm run build
