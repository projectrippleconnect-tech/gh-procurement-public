name: GH Procurement verify stored WAHA key without disclosing it
on:
  push:
    branches: [ops/stage5-safe-preview-retry-20261102]
    paths: [.github/workflows/waha-key-auth-probe.yml]
permissions: {contents: read}
jobs:
  auth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
      SITE: b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g netlify-cli@27.13.0 --silent
      - name: Read-only WAHA authentication probe using existing Netlify secret (never print)
        shell: bash
        run: |
          set -euo pipefail
          for ctx in production dev; do
            candidate="$(netlify env:get WAHA_API_KEY --site "$SITE" --scope functions --context "$ctx" 2>/dev/null || true)"
            if [[ -z "$candidate" || "$candidate" == "undefined" || "$candidate" == "null" || "$candidate" == *'*'* ]]; then
              echo "$ctx: no retrievable key; NOT TESTED"
              continue
            fi
            if [[ "${#candidate}" -lt 24 || "$candidate" =~ [[:space:]] ]]; then
              echo "$ctx: key output not plausible; NOT TESTED"
              continue
            fi
            # Never echo credentials or print raw WAHA JSON (which can contain account information).
            result="$(curl -sS --connect-timeout 8 --max-time 15 -o "$RUNNER_TEMP/wa-probe-$ctx.json" -w '%{http_code}' -H "X-Api-Key: $candidate" 'https://gh-procurement-waha.hostless.app/api/sessions/default' || true)"
            if [[ "$result" == 200 ]]; then
              node - "$RUNNER_TEMP/wa-probe-$ctx.json" "$ctx" <<'NODE'
          const fs=require('node:fs')
          const file=process.argv[2],ctx=process.argv[3]
          try{
            const d=JSON.parse(fs.readFileSync(file,'utf8'))
            console.log(ctx+': WAHA_AUTH_OK session status='+String(d.status||'not-reported').replace(/[^A-Z_]/gi,'').slice(0,30))
          }catch{console.log(ctx+': WAHA_AUTH_OK but response not JSON')}
          NODE
              echo "$ctx: Verified Netlify key authenticates to WAHA."
              exit 0
            elif [[ "$result" == 401 ]]; then
              echo "$ctx: Key rejected by Hostless (401)."
            else
              echo "$ctx: WAHA check HTTP $result; no key disclosed."
            fi
          done
          echo 'BLOCKED: no retrievable stored key passed authenticated read-only WAHA check. Existing production and preview unchanged.'
          exit 1
