name: Phase A - scoped Hostless credential recheck
on:
  push:
    branches: [ops/phase-a-readonly-probe-20261104]
    paths: [.github/workflows/phase-a-hostless-credential-recheck.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HOSTLESS_PROVIDER_AUTH: ${{ secrets.HOSTLESS_TOKEN || secrets.HOSTLESS_API_KEY || secrets.HOSTLESS_ACCESS_TOKEN || secrets.HOSTLESS_AUTH_TOKEN || secrets.GH_HOSTLESS_TOKEN || secrets.GH_HOSTLESS_API_KEY || secrets.HOSTLESS_API_TOKEN || secrets.HOSTLESS_CLOUD_TOKEN || secrets.HOSTLESS_CLOUD_API_KEY || secrets.GH_WAHA_HOSTLESS_TOKEN }}
    steps:
      - name: Inspect provider API only if existing repository credential exists
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const auth=process.env.HOSTLESS_PROVIDER_AUTH;
          if(!auth){console.log('NO_CONFIGURED_HOSTLESS_PROVIDER_SECRET_MATCH');process.exit(0)}
          const header=auth.startsWith('hlk_')?auth:('Bearer '+auth);
          const r=await fetch('https://api.hostless.cloud/v1/apps',{headers:{Authorization:header,Accept:'application/json'},signal:AbortSignal.timeout(12000),redirect:'error'});
          console.log('HOSTLESS_PROVIDER_API_STATUS '+r.status);
          if(r.ok){
            const body=await r.json().catch(()=>[]);
            const list=Array.isArray(body)?body:Array.isArray(body.apps)?body.apps:Array.isArray(body.data)?body.data:[];
            const app=list.find(x=>x?.name==='gh-procurement-waha');
            console.log('GH_WAHA_APP_FOUND '+Boolean(app));
            if(app)console.log('GH_WAHA_APP_STATE '+String(app.status||app.state||'unknown').slice(0,60));
          }else await r.body?.cancel();
          console.log('No secret values, private response payloads, changes, deployments or messages printed or performed');
          NODE
