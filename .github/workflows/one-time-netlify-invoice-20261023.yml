# Owner-authorized ONE-TIME release. No continuous deployment or default-branch changes.
# Trigger requires this special branch, this exact file path, and one exact manual commit message.
name: GH Procurement - One-time supplier invoice Netlify publication
on:
  push:
    branches: ['release/netlify-invoice-20261023-once']
    paths: ['.github/workflows/one-time-netlify-invoice-20261023.yml']
permissions:
  contents: read
concurrency:
  group: gh-procurement-manual-netlify-production
  cancel-in-progress: false
jobs:
  release:
    if: github.event.head_commit.message == 'MANUAL_NETLIFY_PUBLISH_20261023_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_RELEASE_SHA: '665313c0096440e75c9121fc905546d667f28b0b'
      GH_PRODUCTION_URL: 'https://gh-procurement.netlify.app'
      NETLIFY_SITE_ID: 'b36357ec-4dda-4373-a3d7-95f9c8f3ad9e'
      NEXT_PUBLIC_SUPABASE_URL: 'https://huxhcjmcvlhblvpvrron.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42'
      NEXT_TELEMETRY_DISABLED: '1'
      GH_UI_BROWSER_CHANNEL: chrome
      GH_PORTAL_SCHEDULER_MODE: database
      GH_PORTAL_PROCESSING_ENABLED: 'false'
      GH_PORTAL_DISPATCH_ENABLED: 'false'
      GH_PORTAL_DELIVERY_VERIFIED: 'false'
      WAHA_SENDING_ENABLED: 'false'
    steps:
      - name: Pin reviewed source; no changes to records or migrations
        uses: actions/checkout@v4
        with:
          ref: '665313c0096440e75c9121fc905546d667f28b0b'
          persist-credentials: false
      - name: Check source revision and existing Netlify credentials
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN || secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_API_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GH_RELEASE_SHA"
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "BLOCKED: None of GH_NETLIFY_AUTH_TOKEN, NETLIFY_AUTH_TOKEN, NETLIFY_API_TOKEN, NETLIFY_TOKEN is configured. Nothing was deployed."; exit 1; }
          test -f netlify.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies and security audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: TypeScript, tests and isolated database regressions
        run: |
          npm run lint
          npm test
          npm run test:database
      - name: Production Next.js build
        run: npm run build
      - name: Verify supplier invoice portal with intercepted fixture data
        env:
          GH_UI_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          GH_UI_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          node tests/supplier-portal-ui.mjs
          node tests/supplier-portal-mobile.mjs
      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@27.13.0
      - name: Validate exact existing site and disabled Git continuous deployment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN || secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_API_TOKEN || secrets.NETLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          netlify sites:list --json > "$RUNNER_TEMP/gh-netlify-sites.json"
          node -e '
            const fs=require("fs");
            const payload=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const sites=Array.isArray(payload)?payload:(payload.sites||[]);
            const site=sites.find(s=>s.id===process.env.NETLIFY_SITE_ID);
            if(!site || site.name!=="gh-procurement") throw Error("The existing GH Procurement Netlify site is not accessible.");
            if(site.repo || site.repo_url || site.build_settings?.repo_url) throw Error("Git continuous deployment must remain disabled.");
            console.log("Verified existing Netlify gh-procurement site and manual release mode.");
          ' "$RUNNER_TEMP/gh-netlify-sites.json"
      - name: Publish manually to the exact GH Procurement Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN || secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_API_TOKEN || secrets.NETLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          netlify deploy --prod --build --site "$NETLIFY_SITE_ID" \
            --message "Owner-authorized supplier invoice release $GH_RELEASE_SHA" \
            --secret-env "GH_MANUAL_RELEASE_REV=$GH_RELEASE_SHA" \
            --secret-env 'GH_PORTAL_PROCESSING_ENABLED=false' \
            --secret-env 'GH_PORTAL_DISPATCH_ENABLED=false' \
            --secret-env 'GH_PORTAL_DELIVERY_VERIFIED=false' \
            --secret-env 'WAHA_SENDING_ENABLED=false'
      - name: Read-only live production checks
        run: |
          node scripts/check-production.mjs
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict'
          const root=process.env.GH_PRODUCTION_URL
          const response=await fetch(root+'/api/health',{signal:AbortSignal.timeout(20000)})
          assert.equal(response.status,200,'Health check must return 200')
          const d=await response.json()
          assert.equal(d.version,process.env.GH_RELEASE_SHA,'Published revision mismatch')
          assert.equal(d.database,'connected')
          assert.equal(d.schema_ready,true)
          const supplier=await fetch(root+'/supplier/quote',{signal:AbortSignal.timeout(20000)})
          assert.equal(supplier.status,200,'Supplier quotation route must be reachable')
          console.log('Live supplier invoice release verified: '+root)
          NODE
