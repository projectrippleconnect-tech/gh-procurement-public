name: GH WAHA Hostless reachability (no credentials)
on:
  push:
    branches: [fix/waha-hostless-memory-budget-20261102]
    paths: [.github/workflows/waha-hostless-readonly-reachability.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe official WAHA health routes with no messages or secrets
        shell: bash
        run: |
          set -u
          for path in /ping /health /api/sessions/default; do
            # Never follow redirects or print the response body; public status only.
            result="$(curl -sS --noproxy '*' --max-redirs 0 --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "https://gh-procurement-waha.hostless.app$path" 2>/dev/null)" || result=000
            echo "WAHA endpoint $path status: HTTP $result"
          done
          echo '200 on /health shows HTTP endpoint healthy only; WhatsApp WORKING is NOT established.'
          echo '401/403 on /api/sessions/default suggests access is protected.'
          echo '404 on all endpoints suggests Hostless routing/release mismatch; do not change secrets or session DB.'
          # Only GET, no API key, no sessions mutated, no recipient messages.
