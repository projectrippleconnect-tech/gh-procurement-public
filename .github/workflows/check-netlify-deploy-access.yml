name: Diagnose Netlify 403 without deployment
on:
  push:
    branches: [release/diagnostics-435ce400-once]
    paths: [.github/workflows/check-netlify-deploy-access.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Read-only Netlify account and site access review
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.netlify.com/api/v1'
          const headers={Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,Accept:'application/json'}
          async function get(path){
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(10000)})
            const body=await r.json().catch(()=>({}))
            console.log('GET '+path.split('?')[0]+' HTTP '+r.status)
            if(!r.ok){
              const msg=String(body?.error||body?.message||'')
              console.log('Error category:',/credit|billing|usage|limit/i.test(msg)?'CREDIT_OR_BILLING':/permission|access|forbidden|authorization/i.test(msg)?'PERMISSION':'OTHER')
            }
            return r.ok?body:null
          }
          const site=await get('/sites/b36357ec-4dda-4373-a3d7-95f9c8f3ad9e')
          if(!site){console.log('Cannot inspect site.');process.exit(1)}
          console.log('Site name correct:',site.name==='gh-procurement')
          console.log('Site state:',String(site.state||'unreported'))
          console.log('Site locked:',Boolean(site.locked))
          console.log('Current published deploy status:',String(site.published_deploy?.state||'unreported'))
          await get('/sites/b36357ec-4dda-4373-a3d7-95f9c8f3ad9e/deploys?per_page=1')
          const account=site.account_id?await get('/accounts/'+encodeURIComponent(site.account_id)):null
          if(account){
            const credit=account.credits||account.credit_usage||account.billing?.credits||{}
            const flags=['configurable_limits_exceeded','ai_usage_limit_enforced','blocked_by_orb_migration']
            for(const flag of flags){console.log(flag+':',typeof account[flag]==='boolean'?account[flag]:JSON.stringify(account[flag]??null).slice(0,200))}
            const planCredits=account.plan_credits
            console.log('Plan credits:',planCredits&&typeof planCredits==='object'?JSON.stringify(Object.fromEntries(Object.entries(planCredits).filter(([k,v])=>typeof v==='number'||typeof v==='boolean'))).slice(0,400):typeof planCredits==='number'?planCredits:'not reported')
            console.log('Billing cycle start:',String(account.current_billing_period_start||'unreported'))
            console.log('Next billing cycle:',String(account.next_billing_period_start||'unreported'))
            console.log('Account type:',String(account.type||'unreported'))
            console.log('Account credits structure:',Object.keys(credit).sort().join(',')||'not reported')
            console.log('Account credit used:',typeof credit.used==='number'?credit.used:'not reported')
            console.log('Account credit included:',typeof credit.included==='number'?credit.included:'not reported')
            const capabilities=account.capabilities||{}
            console.log('Capability names:',Object.keys(capabilities).filter(k=>/credit|deploy|limit|usage|build|site/i.test(k)).join(',')||'none')
            for(const [key,val] of Object.entries(capabilities)){
              if(!/credit|deploy|limit|usage|build/i.test(key))continue
              if(typeof val==='number'||typeof val==='boolean')console.log('Capability '+key+':',val)
              else if(val&&typeof val==='object')console.log('Capability '+key+':',JSON.stringify(Object.fromEntries(Object.entries(val).filter(([k,v])=>typeof v==='number'||typeof v==='boolean'))).slice(0,250))
            }
            console.log('Account status:',String(account.status||'not reported'))
            console.log('Account keys:',Object.keys(account).filter(x=>/credit|billing|limit|suspend|block|status/i.test(x)).join(',')||'none')
          }
          console.log('READ ONLY: no deploy, no credit purchase, no API secrets printed.')
          NODE
