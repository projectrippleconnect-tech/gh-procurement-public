name: Check WAHA non-secret configuration
on:
  push:
    branches:
      - chore/diagnose-config-20261102
    paths:
      - .github/workflows/check-waha-config.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global netlify-cli@27.13.0
      - name: Verify production metadata without printing values
        shell: bash
        run: |
          set -euo pipefail
          SITE=b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
          base="$(netlify env:get WAHA_BASE_URL --context production --scope functions --site "$SITE")"
          host="$(netlify env:get WAHA_ALLOWED_HOST --context production --scope functions --site "$SITE")"
          session="$(netlify env:get WAHA_SESSION --context production --scope functions --site "$SITE")"
          sending="$(netlify env:get WAHA_SENDING_ENABLED --context production --scope functions --site "$SITE")"
          echo "Base set: $([ -n "$base" ] && echo yes || echo no)"
          echo "Host set: $([ -n "$host" ] && echo yes || echo no)"
          echo "Session default: $([ "$session" = default ] && echo yes || echo no)"
          echo "Sending disabled: $([ "$sending" = false ] && echo yes || echo no)"
