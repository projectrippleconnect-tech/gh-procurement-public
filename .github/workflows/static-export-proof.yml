name: Procurement Static Export Proof (No Deploy)
on:
  push:
    branches:
      - test/cloudflare-static-20261009
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/static-export-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-procurement-static-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-export-proof:
    name: Typecheck, contract tests, and static export (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Contract tests
        run: npm test
      - name: Static export build
        run: npm run build
      - name: Inspect Cloudflare Pages output
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/health/index.html
          test -s out/_headers
          test -s out/manifest.webmanifest
          test -s out/pdf.worker.min.mjs
          test -s out/tesseract/worker.min.js
          file_count="$(find out -type f | wc -l)"
          max_bytes="$(find out -type f -printf '%s\n' | sort -nr | head -1)"
          echo "Exported files: $file_count"
          echo "Largest file bytes: $max_bytes"
          echo "Largest ten exported files:"
          find out -type f -printf '%s %p\n' | sort -nr | head -10
          test "$file_count" -le 20000
          test "$max_bytes" -le 26214400
          echo "Static Cloudflare Pages output is within file-count and per-file limits."
      - name: Install browser smoke tools
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only mobile browser smoke (localhost; no deployment)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory out > /tmp/gh-static-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/static-browser-proof.mjs
      - name: Save validated Cloudflare static bundle (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: gh-procurement-cloudflare-static-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
