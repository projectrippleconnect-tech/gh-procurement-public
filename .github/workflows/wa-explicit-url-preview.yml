# One-time diagnostic draft only; do not install on main or deploy to production.
name: GH WAHA explicit runtime URL preview
on:
  push:
    branches: [ops/stage5-safe-preview-retry-20261102]
    paths: [.github/workflows/wa-explicit-url-preview.yml]
permissions:
  contents: read
  issues: write
concurrency:
  group: gh-wa-explicit-url-preview-20261102
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
      SITE: b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
      SOURCE_SHA: 435ce4004489916821ab5c4d781784e6035deb0b
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      NEXT_TELEMETRY_DISABLED: '1'
      # Nonsecret runtime values are explicitly supplied at build AND deploy.
      WAHA_BASE_URL: https://gh-procurement-waha.hostless.app
      WAHA_ALLOWED_HOST: gh-procurement-waha.hostless.app
      WAHA_SESSION: default
      WAHA_SENDING_ENABLED: 'false'
      GH_AUTO_DISPATCH_ENABLED: 'false'
      GH_AUTO_DELIVERY_TEST_VERIFIED: 'false'
      GH_WA_AUDIT_ENABLED: 'false'
      GH_PORTAL_PROCESSING_ENABLED: 'false'
      GH_PORTAL_DISPATCH_ENABLED: 'false'
      GH_PORTAL_DELIVERY_VERIFIED: 'false'
    steps:
      - name: Fail closed unless approved site and no direct sends
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          test "$SITE" = "b36357ec-4dda-4373-a3d7-95f9c8f3ad9e"
          test "$SOURCE_SHA" = "435ce4004489916821ab5c4d781784e6035deb0b"
          test "$WAHA_SENDING_ENABLED" = false
      - uses: actions/checkout@v4
        with:
          ref: 435ce4004489916821ab5c4d781784e6035deb0b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked build
        run: |
          npm ci
          npm run build
      - name: Install pinned CLI and check exact existing Netlify site
        run: |
          set -euo pipefail
          npm i -g netlify-cli@27.13.0 --silent
          netlify sites:list --json > "$RUNNER_TEMP/sites.json"
          node - <<'NODE'
          const fs=require('node:fs')
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/sites.json','utf8'))
          const site=(Array.isArray(x)?x:(x.sites||[])).find(y=>y.id===process.env.SITE)
          if(!site||site.name!=='gh-procurement')throw Error('Wrong site; abort')
          console.log('Verified existing site; draft-only.')
          NODE
      - name: Create protected draft with nonsecret URL explicitly available to functions
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          netlify deploy --build --context production --site "$SITE" \
            --message "Diagnostic draft: force nonsecret WAHA endpoint into functions; supplier sends OFF" \
            --env "WAHA_BASE_URL=https://gh-procurement-waha.hostless.app" \
            --env "WAHA_ALLOWED_HOST=gh-procurement-waha.hostless.app" \
            --env "WAHA_SESSION=default" \
            --secret-env "GH_MANUAL_RELEASE_REV=$SOURCE_SHA" \
            --secret-env 'WAHA_SENDING_ENABLED=false' \
            --secret-env 'GH_AUTO_DISPATCH_ENABLED=false' \
            --secret-env 'GH_AUTO_DELIVERY_TEST_VERIFIED=false' \
            --secret-env 'GH_WA_AUDIT_ENABLED=false' \
            --secret-env 'GH_PORTAL_PROCESSING_ENABLED=false' \
            --secret-env 'GH_PORTAL_DISPATCH_ENABLED=false' \
            --secret-env 'GH_PORTAL_DELIVERY_VERIFIED=false' \
            --json > "$RUNNER_TEMP/preview.json"
          node - <<'NODE'
          const fs=require('node:fs')
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/preview.json','utf8'))
          const url=d.deploy_url||d.deployUrl||d.url||''
          const id=d.deploy_id||d.deployId||d.id||''
          if(!url.startsWith('https://')||!url.endsWith('--gh-procurement.netlify.app'))throw Error('Draft URL validation failed')
          if(!/^[a-f0-9]{24}$/.test(id))throw Error('Deploy ID unavailable')
          console.log('DRAFT_DEPLOY_URL='+url)
          console.log('DRAFT_DEPLOY_ID='+id)
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'draft_url='+url+'\n')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'draft_id='+id+'\n')
          NODE
      - name: Verify Netlify draft ready without bypassing protection
        env:
          DRAFT_ID: ${{ steps.deploy.outputs.draft_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const id=process.env.DRAFT_ID
          const r=await fetch('https://api.netlify.com/api/v1/deploys/'+id,{headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN},signal:AbortSignal.timeout(15000)})
          assert.equal(r.status,200)
          const d=await r.json()
          assert.equal(d.state,'ready')
          assert.ok(!d.published_at)
          console.log('Draft ready and NOT production. Access protection left unchanged. No supplier sends.')
          NODE
      - name: Record draft status in Stage 5 issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const good='${{ steps.deploy.outcome }}'==='success'
            const url='${{ steps.deploy.outputs.draft_url }}'
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:158,
              body:(good?'Protected draft created with explicit *nonsecret* functions gateway URL: '+url:'Explicit nonsecret URL draft failed to publish; production remains unchanged.')+' — source SHA '+process.env.SOURCE_SHA+'. No API key was read or printed, no supplier sends, production unchanged. '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId
            })
