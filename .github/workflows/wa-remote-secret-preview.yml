# One-time trusted remote preview build. No production promotion and no supplier sends.
name: GH Procurement protected Netlify remote WAHA-key diagnostic
on:
  push:
    branches:
      - ops/stage5-safe-preview-retry-20261102
    paths:
      - .github/workflows/wa-remote-secret-preview.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: gh-remote-preview-waha-20261102
  cancel-in-progress: false
jobs:
  safe-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
      SITE: b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
      RELEASE_SHA: 435ce4004489916821ab5c4d781784e6035deb0b
      WAHA_SENDING_ENABLED: 'false'
      GH_AUTO_DISPATCH_ENABLED: 'false'
      GH_AUTO_DELIVERY_TEST_VERIFIED: 'false'
      GH_WA_AUDIT_ENABLED: 'false'
      GH_PORTAL_PROCESSING_ENABLED: 'false'
      GH_PORTAL_DISPATCH_ENABLED: 'false'
      GH_PORTAL_DELIVERY_VERIFIED: 'false'
    steps:
      - name: Require existing Netlify credential and exact source
        run: |
          set -eu
          test -n "$NETLIFY_AUTH_TOKEN"
          test "$RELEASE_SHA" = 435ce4004489916821ab5c4d781784e6035deb0b
      - uses: actions/checkout@v4
        with:
          ref: 435ce4004489916821ab5c4d781784e6035deb0b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current Netlify CLI with remote build support
        run: |
          npm install -g netlify-cli@latest --silent
          netlify --version
      - name: Check existing project and production safety switches
        run: |
          set -euo pipefail
          netlify sites:list --json > "$RUNNER_TEMP/sites.json"
          node - <<'NODE'
          const fs=require('fs')
          const o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/sites.json','utf8'))
          const site=(Array.isArray(o)?o:(o.sites||[])).find(s=>s.id===process.env.SITE)
          if(!site||site.name!=='gh-procurement')throw Error('Target mismatch')
          console.log('Existing GH Procurement site verified.')
          NODE
          for k in WAHA_SENDING_ENABLED GH_AUTO_DISPATCH_ENABLED GH_AUTO_DELIVERY_TEST_VERIFIED GH_WA_AUDIT_ENABLED GH_PORTAL_PROCESSING_ENABLED GH_PORTAL_DISPATCH_ENABLED GH_PORTAL_DELIVERY_VERIFIED; do
            v="$(netlify env:get "$k" --site "$SITE" --context production --scope functions)"
            if [ "$v" != false ]; then echo "Safety gate $k not disabled"; exit 1; fi
            echo "Safety gate $k: disabled"
          done
      - name: Build ON NETLIFY as a DRAFT; use Netlify-hosted protected key; never publish
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          # Netlify-hosted build can access Netlify's own secret store. We never attempt
          # to read WAHA_API_KEY through the CLI, and never log environment contents.
          netlify deploy --remote --context production --site "$SITE" \
            --message "One-time protected read-only WAHA config draft (Netlify remote build, sending OFF)" \
            --secret-env "GH_MANUAL_RELEASE_REV=$RELEASE_SHA" \
            --secret-env 'WAHA_SENDING_ENABLED=false' \
            --secret-env 'GH_AUTO_DISPATCH_ENABLED=false' \
            --secret-env 'GH_AUTO_DELIVERY_TEST_VERIFIED=false' \
            --secret-env 'GH_WA_AUDIT_ENABLED=false' \
            --secret-env 'GH_PORTAL_PROCESSING_ENABLED=false' \
            --secret-env 'GH_PORTAL_DISPATCH_ENABLED=false' \
            --secret-env 'GH_PORTAL_DELIVERY_VERIFIED=false' \
            --json > "$RUNNER_TEMP/remote-draft.json"
          node - <<'NODE'
          const fs=require('fs')
          const o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/remote-draft.json','utf8'))
          const url=o.deploy_url||o.deployUrl||o.url||''
          const id=o.deploy_id||o.deployId||o.id||''
          if(!/^https:\/\/[a-z0-9-]+--gh-procurement\.netlify\.app$/i.test(url))throw Error('Not a draft URL')
          console.log('REMOTE_DRAFT_URL='+url)
          console.log('REMOTE_DRAFT_ID='+id)
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'url='+url+'\n')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'id='+id+'\n')
          NODE
      - name: Verify draft is ready and production unchanged
        id: verify
        env:
          DRAFT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const token=process.env.NETLIFY_AUTH_TOKEN
          const h={Authorization:'Bearer '+token}
          const draft=await fetch('https://api.netlify.com/api/v1/deploys/'+process.env.DRAFT_ID,{headers:h,signal:AbortSignal.timeout(12000)})
          assert.equal(draft.status,200)
          const d=await draft.json()
          assert.equal(d.state,'ready')
          assert.ok(!d.published_at)
          const prod=await fetch('https://gh-procurement.netlify.app/api/health',{signal:AbortSignal.timeout(12000)})
          assert.equal(prod.status,200)
          const health=await prod.json()
          assert.equal(health.version,'8df2c86a35897ec85e6c1708118eba9c6803ccc1')
          console.log('PASS: draft ready, production version unchanged; no supplier sends.')
          NODE
      - name: Record status in Stage 5 issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pass='${{ steps.verify.outcome }}'==='success'
            const url='${{ steps.deploy.outputs.url }}'
            const body=pass
              ? 'One-time protected Netlify REMOTE-build draft ready: '+url+'. Secret sourced by Netlify, never read in GitHub. Production unchanged; supplier sends off. Requires logged-in admin check, not yet evidence of WAHA WORKING.'
              : 'One-time Netlify REMOTE-build draft did not pass. Production unchanged; supplier sends off. Inspect run.'
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:158,body:body+' Run: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId})
