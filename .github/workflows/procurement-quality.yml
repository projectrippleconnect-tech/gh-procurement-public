name: Procurement Quality Gate
on:
  push:
    branches: [main, 'release/group-routing-plus-reviewed-sections-20261015']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procurement-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publishable client configuration, already public in lib/supabase.ts.
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      GH_UI_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify public Supabase build configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing NEXT_PUBLIC_SUPABASE_URL secret'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run lint
      - name: Contract tests
        run: npm test
      - name: Verify full production-schema lifecycle and authorization
        run: npm run test:database
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify compact supplier quotation bill at mobile and desktop widths
        env:
          GH_UI_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          GH_UI_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          node tests/supplier-portal-ui.mjs
          node tests/supplier-portal-mobile.mjs
          node tests/supplier-verified-ui.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-ui-evidence
          path: test-results/
          if-no-files-found: ignore

  browser-regression:
    name: Browser regression — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Stock
            modes: 'SIMPLIFIED_STOCK COMPANY_LOADING COMPANY_ITEMS STOCK_NUMBERS HELD_SEARCH'
          - group: Directory and documents
            modes: 'GROUP_SEND COMPANY_PO CONTACT_PASTE PRINT_TEMPLATES CATALOG'
          - group: Access and layout
            modes: 'SETTINGS_SEARCH RECORD_DELETE PICKERS ACCESS SCROLL_PANELS'
          - group: Purchasing
            modes: 'FOCUSED GUIDE_APPROVAL BULK_SEND PO_MANUAL SIZE_ORDER'
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      GH_UI_BROWSER_CHANNEL: chrome
      GH_UI_WIDTHS: '320,390,768,1366'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise the existing isolated regression modes
        env:
          REGRESSION_MODES: ${{ matrix.modes }}
        run: |
          result=0
          for mode in $REGRESSION_MODES; do
            env "GH_UI_${mode}=1" npm run test:ui || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  stage-two-browser:
    name: Stage 2 browser — ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [WORK_CASES, RECEIVING, PERFORMANCE]
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      GH_UI_BROWSER_CHANNEL: chrome
      GH_UI_WIDTHS: '320,390,768,1366'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise isolated browser flows on the reviewed source
        run: env GH_UI_${{ matrix.mode }}=1 npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-two-${{ matrix.mode }}
          path: test-results/
          retention-days: 7

  quote-conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: isolated_quotes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic quotation guards in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d isolated_quotes -v ON_ERROR_STOP=1 -f tests/sql/quote-conflict-isolated.sql

      - name: Verify item creation and supplier deletion in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_catalog
          psql -h 127.0.0.1 -U postgres -d isolated_catalog -v ON_ERROR_STOP=1 -f tests/sql/catalog-management-isolated.sql
      - name: Verify record deletion and serials in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_record_delete
          psql -h 127.0.0.1 -U postgres -d isolated_record_delete -v ON_ERROR_STOP=1 -f tests/sql/record-delete-serials-isolated.sql
      - name: Verify time and location access controls in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_access
          psql -h 127.0.0.1 -U postgres -d isolated_access -v ON_ERROR_STOP=1 -f tests/sql/access-restrictions-isolated.sql
      - name: Verify company section hierarchy and isolated moves in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_sections
          psql -h 127.0.0.1 -U postgres -d isolated_company_sections -v ON_ERROR_STOP=1 -f tests/sql/company-sections-isolated.sql
      - name: Verify multi-supplier group RFQs and automatic direct PO routing
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_routes
          psql -h 127.0.0.1 -U postgres -d isolated_company_routes -v ON_ERROR_STOP=1 -f tests/sql/company-group-routing-isolated.sql

      - name: Verify stock-triggered RFQs, POs, templates and idempotent submission
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_stock_auto
          psql -h 127.0.0.1 -U postgres -d isolated_company_stock_auto -v ON_ERROR_STOP=1 -f tests/sql/company-stock-auto-rfq-isolated.sql

      - name: Verify independent group supplier contacts and access permissions
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_group_contacts
          psql -h 127.0.0.1 -U postgres -d isolated_group_contacts -v ON_ERROR_STOP=1 -f tests/sql/company-group-contact-pool-isolated.sql

      - name: Verify explicit company auto PO and separate RFQ history in isolated PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_explicit_direct
          psql -h 127.0.0.1 -U postgres -d isolated_company_explicit_direct -v ON_ERROR_STOP=1 -f tests/sql/company-explicit-auto-po-history-isolated.sql

      - name: Verify real stock recounts and pending-order protections
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_recounts
          psql -h 127.0.0.1 -U postgres -d isolated_company_recounts -v ON_ERROR_STOP=1 -f tests/sql/company-recount-orders-isolated.sql
          node tests/company-recount-concurrency.mjs isolated_company_recounts

      - name: Verify default screenshot protection and override authorization
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_capture
          psql -h 127.0.0.1 -U postgres -d isolated_capture -v ON_ERROR_STOP=1 -f tests/sql/capture-controls-isolated.sql

      - name: Verify nested company section migration in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_company_sections_hierarchy
          psql -h 127.0.0.1 -U postgres -d isolated_company_sections_hierarchy -v ON_ERROR_STOP=1 -f tests/sql/company-section-hierarchy-isolated.sql
