name: Procurement Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procurement-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publishable client configuration, already public in lib/supabase.ts.
      NEXT_PUBLIC_SUPABASE_URL: https://huxhcjmcvlhblvpvrron.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__Z6JVArxsa4aCweBy7SDyw_O3pLIm42
      GH_UI_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify public Supabase build configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing NEXT_PUBLIC_SUPABASE_URL secret'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run lint
      - name: Contract tests
        run: npm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify the runner's installed Chrome
        run: google-chrome --version
      - name: Verify searchable pickers and keyboard focus
        env:
          GH_UI_PICKERS: '1'
        run: npm run test:ui
      - name: Verify quick-add, deletion controls and editable company bill sheets and reviewed GRN OCR
        env:
          GH_UI_CATALOG: '1'
        run: npm run test:ui
      - name: Verify company stock PDFs and editable supplier templates
        env:
          GH_UI_PRINT_TEMPLATES: '1'
        run: npm run test:ui
      - name: Verify stock-number display, modern dialogs and accessible menu
        env:
          GH_UI_STOCK_NUMBERS: '1'
        run: npm run test:ui
      - name: Verify guided layouts at mobile, tablet and desktop widths
        run: npm run test:ui
      - name: Verify automatic three-stage procurement progression
        env:
          GH_UI_GUIDE_APPROVAL: '1'
        run: npm run test:ui
      - name: Verify supplier checklist and bulk PNG/caption sending
        env:
          GH_UI_BULK_SEND: '1'
        run: npm run test:ui
      - name: Verify additional sizes become separate order lines
        env:
          GH_UI_SIZE_ORDER: '1'
        run: npm run test:ui
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-ui-evidence
          path: test-results/
          if-no-files-found: ignore

  quote-conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: isolated_quotes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic quotation guards in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d isolated_quotes -v ON_ERROR_STOP=1 -f tests/sql/quote-conflict-isolated.sql

      - name: Verify item creation and supplier deletion in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_catalog
          psql -h 127.0.0.1 -U postgres -d isolated_catalog -v ON_ERROR_STOP=1 -f tests/sql/catalog-management-isolated.sql
