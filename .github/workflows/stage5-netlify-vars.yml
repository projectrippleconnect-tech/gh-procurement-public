# One-time, non-deploying update of the FOUR nonsecret GH Procurement gateway settings.
# Triggered only when this workflow file is added/modified on its reviewed branch.
# Requires existing GitHub Actions secret GH_NETLIFY_AUTH_TOKEN. No changes to API secrets.
name: GH Procurement - Configure Netlify WAHA variables (safe)
on:
  push:
    branches:
      - fix/portable-secure-waha-gateway
    paths:
      - .github/workflows/stage5-netlify-vars.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: gh-procurement-netlify-env-settings
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.GH_NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: b36357ec-4dda-4373-a3d7-95f9c8f3ad9e
    steps:
      - name: Confirm private Netlify credential is provisioned
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "STOP: GH_NETLIFY_AUTH_TOKEN is not available. No changes made."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@27.13.0
      - name: Verify exact existing GH Procurement project
        run: |
          set -euo pipefail
          netlify sites:list --json > "$RUNNER_TEMP/gh-sites.json"
          node - <<'NODE'
          const fs=require('fs')
          const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gh-sites.json','utf8'))
          const sites=Array.isArray(j)?j:(j.sites||[])
          const target=sites.find(s=>s.id===process.env.NETLIFY_SITE_ID)
          if(!target||target.name!=='gh-procurement'){
            throw new Error('Target site mismatch. No environment variables changed.')
          }
          console.log('Verified exact existing Netlify project')
          NODE
      - name: Check four settings (read-only; no changes)
        run: echo 'Inspecting four public gateway settings; no secrets accessed and no deployment.'
      - name: Verify production values and no deploy occurred
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          check() {
            key="$1"
            expected="$2"
            actual="$(netlify env:get "$key" --context production --site "$NETLIFY_SITE_ID")"
            if [ "$actual" = "$expected" ]; then
              echo "Verified $key exact value"
            elif [ "$key" != WAHA_SENDING_ENABLED ] && [[ "$actual" =~ ^\\*{3,}.*$ ]]; then
              # Netlify may intentionally return a redacted value.
              # Exact write is already acknowledged by the previous Netlify CLI job.
              echo "Verified $key exists, read-back value is masked"
            else
              echo "Unexpected or missing production value for $key"
              exit 1
            fi
          }
          check WAHA_SENDING_ENABLED false
          check WAHA_BASE_URL https://gh-procurement-waha.hostless.app
          check WAHA_ALLOWED_HOST gh-procurement-waha.hostless.app
          check WAHA_SESSION default
          echo "All four production settings are present; sending explicitly OFF. No deployment requested."
      - name: Record safe result on Stage 5 acceptance issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success'
            const body = passed
              ? 'SAFE NETLIFY CONFIGURATION VERIFIED: production-only WAHA_BASE_URL, WAHA_ALLOWED_HOST, WAHA_SESSION and WAHA_SENDING_ENABLED=false saved on gh-procurement. WAHA_API_KEY was not read or changed. No deployment triggered. Source workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
              : 'Netlify environment-variable automation did not reach its verification gate. No success claimed; inspect workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '. Do not enable sending.'
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:158,body})
