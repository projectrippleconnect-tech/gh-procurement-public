# Coordination-only run: same release SHA is already being deployed by run 41396056700.
# This intentionally supersedes the duplicate queued run in the same concurrency group.
name: GH Procurement - Avoid duplicate one-time release
on:
  push:
    branches: [ops/one-time-stage5-waha-diagnostics-release-20261102]
    paths: [.github/workflows/one-time-waha-diagnostics-release.yml]
permissions:
  contents: read
concurrency:
  group: gh-procurement-manual-netlify-production
  cancel-in-progress: false
jobs:
  no_duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avoid second Netlify deployment
        run: |
          echo "No duplicate deploy: identical Stage 5 diagnostic commit is releasing in workflow 41396056700."
          echo "No Netlify settings changed and no supplier messages sent."
