name: GH Procurement Android companion APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-companion/**'
      - 'components/modules-buying.jsx'
      - 'tests/contracts.test.mjs'
      - '.github/workflows/android-companion-apk.yml'
  push:
    branches:
      - feature/android-direct-supplier-share-20261009
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and unit test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gh-procurement-android-companion-test-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
